{% extends "base.html" %}
{% block title %}Loglar{% endblock %}
{% block content %}
<section class="section-header"><h1>Log Kayıtları</h1></section>
<div class="table-wrap">
    <table>
        <thead><tr><th>Zaman</th><th>Kullanıcı</th><th>İşlem</th><th>Detay</th></tr></thead>
        <tbody>
            {% for log in logs %}
                <tr>
                    <td>{{ log.zaman }}</td>
                    <td>{{ log.email or 'Sistem' }}</td>
                    <td>{{ log.islem }}</td>
                    <td>{{ log.detay }}</td>
                </tr>
            {% else %}
                <tr><td colspan="4">Log kaydı yok.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
